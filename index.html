<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grey Ludge Hotel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #9a9998;
        }

        /* PRELOADER */
        #preloader {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #d3d1cc;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.7s ease, visibility 0.7s ease;
        }

        #preloader.hide {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
        }

        /* ONDRIP ANIMATION */
        .brand {
            font-size: clamp(45px, 9vw, 90px);
            font-weight: 800;
            letter-spacing: 4px;
            color: #111827;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .brand span {
            display: inline-block;
            animation: letterWave 1.4s infinite ease-in-out;
        }

        .brand span:nth-child(1) { animation-delay: 0s; }
        .brand span:nth-child(2) { animation-delay: 0.12s; }
        .brand span:nth-child(3) { animation-delay: 0.24s; }
        .brand span:nth-child(4) { animation-delay: 0.36s; }
        .brand span:nth-child(5) { animation-delay: 0.48s; }
        .brand span:nth-child(6) { animation-delay: 0.60s; }
        .brand span:nth-child(7) { animation-delay: 0.70s; }
        .brand span:nth-child(8) { animation-delay: 0.90s; }

        @keyframes letterWave {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            50% {
                transform: translateY(-18px);
                opacity: 1;
            }
        }

        /* LOADING TEXT */
        .loading-text {
            color: #6b7280;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        /* DOTS */
        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #111827;
            animation: dots 1.2s infinite ease-in-out;
        }

        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.15s; }
        .dots span:nth-child(3) { animation-delay: 0.30s; }

        @keyframes dots {
            0%, 80%, 100% {
                transform: scale(0.5);
                opacity: 0.4;
            }

            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* WEBSITE */
        #website {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 0.9s ease;
        }

        #website.loaded {
            opacity: 1;
        }

        @media (max-width: 600px) {
            .brand {
                font-size: 48px;
                letter-spacing: 2px;
            }

            .loading-text {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="loader-content">

            <div class="brand">
                <span>M</span>
                <span>B</span>
                <span>A</span>
                <span>Y</span>
                <span>O</span>
                <span>M</span>
                <span>-</span>
                <span>P</span>
                <span>O</span>
                <span>S</span>
            </div>

            <div class="loading-text">
                LOADING...
            </div>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    </div>

    <!-- YOUR WEBSITE -->
    <iframe
        id="website"
        src="https://script.google.com/macros/s/AKfycbxK9ygfN1oGz3MMyt4D4JMkjRF1xqz4CwHEvSAr3S7-f-IlZHnGF9zF-eItHpfZEoZM/exec"
        allowfullscreen>
    </iframe>

    <script>
        const iframe = document.getElementById("website");
        const preloader = document.getElementById("preloader");

        iframe.addEventListener("load", function () {

            iframe.classList.add("loaded");

            setTimeout(function () {
                preloader.classList.add("hide");
            }, 400);

        });

        /* Fallback after 10 seconds */
        setTimeout(function () {
            iframe.classList.add("loaded");
            preloader.classList.add("hide");
        }, 8000);
    </script>

</body>
</html>
